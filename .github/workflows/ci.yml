name: CI Pipeline & Quality Engine

on:
  schedule:
    - cron: '15 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      test_cycles:
        description: 'Number of test & benchmark cycles'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure Git Committer Identity
        run: |
          git config --global user.name "IshaanYK"
          git config --global user.email "isen97509@gmail.com"

      - name: Run Quality Engine & Performance Benchmarks
        env:
          GH_USER: IshaanYK
          GH_EMAIL: isen97509@gmail.com
          CYCLES: ${{ github.event.inputs.test_cycles }}
        run: |
          python scripts/ci_runner.py
